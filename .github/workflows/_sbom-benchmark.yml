---
name: SBOM Benchmark (Reusable)

on:
  workflow_call:
    inputs:
      name:
        description: 'Benchmark name (used for artifact prefix and display)'
        required: true
        type: string
      target_type:
        description: 'Type of target: filesystem or docker'
        required: true
        type: string
      target_path:
        description: 'Path to scan (filesystem) or image name (docker)'
        required: true
        type: string
      setup_commands:
        description: 'Commands to run before scanning (e.g., clone repo, build image)'
        required: false
        type: string
        default: ''
      sbomify_input:
        description: 'Input for sbomify: LOCK_FILE path or DOCKER_IMAGE name'
        required: true
        type: string
      sbomify_input_type:
        description: 'Type of sbomify input: lock_file or docker_image'
        required: true
        type: string
      baseline_command:
        description: 'Command to generate baseline (optional)'
        required: false
        type: string
        default: ''
      extra_tools:
        description: 'Additional tools to run (comma-separated: cyclonedx-python,sbom4python)'
        required: false
        type: string
        default: ''
      title:
        description: 'Title for the summary table'
        required: false
        type: string
        default: ''

env:
  TRIVY_VERSION: 0.68.2
  SYFT_VERSION: 1.39.0
  SBOMQS_VERSION: 2.0.2
  CYCLONEDX_PYTHON_VERSION: 7.2.1
  SBOM4PYTHON_VERSION: 0.12.4

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        if: inputs.setup_commands != ''
        run: ${{ inputs.setup_commands }}

      - name: Install Trivy
        run: |
          curl -L -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar xvf /tmp/trivy.tgz -C /tmp
          chmod +x /tmp/trivy

      - name: "CycloneDX: Generate SBOM"
        run: |
          /tmp/trivy ${{ inputs.target_type == 'docker' && 'image' || 'fs' }} \
            --format cyclonedx \
            --output /tmp/trivy.cdx.json \
            ${{ inputs.target_path }}

      - name: "SPDX: Generate SBOM"
        run: |
          /tmp/trivy ${{ inputs.target_type == 'docker' && 'image' || 'fs' }} \
            --format spdx-json \
            --output /tmp/trivy.spdx.json \
            ${{ inputs.target_path }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-trivy
          path: "/tmp/trivy.*.json"

  syft:
    name: Syft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        if: inputs.setup_commands != ''
        run: ${{ inputs.setup_commands }}

      - name: Install Syft
        run: |
          curl -L -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          tar xvf /tmp/syft.tgz -C /tmp
          chmod +x /tmp/syft

      - name: "CycloneDX: Generate SBOM"
        run: |
          /tmp/syft ${{ inputs.target_path }} \
            -o cyclonedx-json > /tmp/syft.cdx.json

      - name: "SPDX: Generate SBOM"
        run: |
          /tmp/syft ${{ inputs.target_path }} \
            -o spdx-json > /tmp/syft.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-syft
          path: "/tmp/syft.*.json"

  sbomify:
    name: sbomify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        if: inputs.setup_commands != ''
        run: ${{ inputs.setup_commands }}

      - name: Generate SBOM
        uses: sbomify/github-action@master
        env:
          LOCK_FILE: ${{ inputs.sbomify_input_type == 'lock_file' && inputs.sbomify_input || '' }}
          DOCKER_IMAGE: ${{ inputs.sbomify_input_type == 'docker_image' && inputs.sbomify_input || '' }}
          OUTPUT_FILE: sbomify.cdx.json
          UPLOAD: "false"
          AUGMENT: "false"
          ENRICH: "true"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-sbomify
          path: "sbomify.cdx.json"

  cyclonedx-python:
    name: CycloneDX Python
    if: contains(inputs.extra_tools, 'cyclonedx-python')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CycloneDX Python
        run: |
          python -m pip install cyclonedx-bom==${CYCLONEDX_PYTHON_VERSION}

      - name: "CycloneDX: Generate SBOM"
        run: |
          cyclonedx-py requirements ${{ inputs.sbomify_input }} \
            -o /tmp/cyclonedx.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-cyclonedx
          path: "/tmp/cyclonedx.*.json"

  sbom4python:
    name: sbom4python
    if: contains(inputs.extra_tools, 'sbom4python')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sbom4python
        run: |
          python -m pip install sbom4python==${SBOM4PYTHON_VERSION}

      - name: "CycloneDX: Generate SBOM"
        run: |
          sbom4python -r ${{ inputs.sbomify_input }} \
            --sbom cyclonedx --format json \
            -o /tmp/sbom4python.cdx.json

      - name: "SPDX: Generate SBOM"
        run: |
          sbom4python -r ${{ inputs.sbomify_input }} \
            --sbom spdx --format json \
            -o /tmp/sbom4python.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-sbom4python
          path: "/tmp/sbom4python.*.json"

  baseline:
    name: Baseline
    if: inputs.baseline_command != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        if: inputs.setup_commands != ''
        run: ${{ inputs.setup_commands }}

      - name: Generate baseline
        run: |
          ${{ inputs.baseline_command }} > /tmp/baseline.txt

      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-baseline
          path: "/tmp/baseline.txt"

  score:
    name: Score
    needs:
      - trivy
      - syft
      - sbomify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOMs
        uses: actions/download-artifact@v4

      - name: Install sbomqs
        run: |
          curl -L -o /tmp/sbomqs \
            "https://github.com/interlynk-io/sbomqs/releases/download/v${SBOMQS_VERSION}/sbomqs-linux-amd64"
          chmod +x /tmp/sbomqs

      - name: Generate Summary Table
        env:
          BENCHMARK_NAME: ${{ inputs.name }}
          BENCHMARK_TITLE: ${{ inputs.title }}
          EXTRA_TOOLS: ${{ inputs.extra_tools }}
        run: |
          set +e  # Don't exit on error - some files may not exist

          # Helper: safely convert value to integer, defaulting to 0
          to_int() {
            local val="${1:-0}"
            # Remove any non-numeric characters and handle null/empty
            val="${val//[^0-9]/}"
            echo "${val:-0}"
          }

          # Helper: calculate duplication percentage
          calc_dup() {
            local total=$(to_int "$1")
            local unique=$(to_int "$2")
            if [[ "$total" -eq 0 ]]; then
              echo "N/A"
              return
            fi
            local dups=$((total - unique))
            [[ "$dups" -lt 0 ]] && dups=0
            printf "%.2f%%" "$(echo "scale=2; $dups * 100 / $total" | bc)"
          }

          # Helper: calculate percentage safely
          calc_pct() {
            local count=$(to_int "$1")
            local total=$(to_int "$2")
            if [[ "$total" -eq 0 ]]; then
              echo "0"
              return
            fi
            echo "scale=0; $count * 100 / $total" | bc
          }

          # Score CycloneDX SBOM
          score_cdx() {
            local path="$1"
            [[ ! -f "$path" ]] && return

            # Get sbomqs results
            local result
            result=$(/tmp/sbomqs score "$path" -j 2>/dev/null) || result="{}"

            # Extract component names once, then count
            local names
            names=$(jq -r '.components[]?.name // empty' "$path" 2>/dev/null)
            local total=$(echo "$names" | grep -c . || echo 0)
            local unique=$(echo "$names" | sort -u | grep -c . || echo 0)

            local version
            version=$(echo "$result" | jq -r '.files[0].spec_version // "N/A"' 2>/dev/null) || version="N/A"
            local score
            score=$(echo "$result" | jq -r '.files[0].avg_score // "N/A"' 2>/dev/null) || score="N/A"

            echo "${total}|${unique}|${version}|${score}"
          }

          # Score SPDX SBOM
          score_spdx() {
            local path="$1"
            [[ ! -f "$path" ]] && return

            # Get sbomqs results
            local result
            result=$(/tmp/sbomqs score "$path" -j 2>/dev/null) || result="{}"

            # Extract package names once, then count
            local names
            names=$(jq -r '.packages[]?.name // empty' "$path" 2>/dev/null)
            local total=$(echo "$names" | grep -c . || echo 0)
            local unique=$(echo "$names" | sort -u | grep -c . || echo 0)

            local version
            version=$(echo "$result" | jq -r '.files[0].spec_version // "N/A"' 2>/dev/null) || version="N/A"
            local score
            score=$(echo "$result" | jq -r '.files[0].avg_score // "N/A"' 2>/dev/null) || score="N/A"

            echo "${total}|${unique}|${version}|${score}"
          }

          # NTIA Minimum Elements check for CycloneDX
          ntia_cdx() {
            local path="$1"
            [[ ! -f "$path" ]] && return

            # Get total component count
            local total
            total=$(jq '.components | length // 0' "$path" 2>/dev/null) || total=0
            total=$(to_int "$total")

            # SBOM-level checks
            local has_timestamp
            has_timestamp=$(jq -r '.metadata.timestamp // empty' "$path" 2>/dev/null)
            local has_author
            has_author=$(jq -r '
              .metadata.authors[0].name //
              .metadata.manufacturer.name //
              .metadata.supplier.name //
              empty
            ' "$path" 2>/dev/null)

            # Component-level NTIA fields - single jq call for efficiency
            local counts
            counts=$(jq '{
              with_supplier: [.components[]? | select(.supplier.name != null or .publisher != null)] | length,
              with_version: [.components[]? | select(.version != null and .version != "")] | length,
              with_purl: [.components[]? | select(.purl != null)] | length,
              has_deps: (.dependencies | length // 0)
            }' "$path" 2>/dev/null) || counts='{"with_supplier":0,"with_version":0,"with_purl":0,"has_deps":0}'

            local with_supplier=$(echo "$counts" | jq -r '.with_supplier // 0')
            local with_version=$(echo "$counts" | jq -r '.with_version // 0')
            local with_purl=$(echo "$counts" | jq -r '.with_purl // 0')
            local has_deps=$(echo "$counts" | jq -r '.has_deps // 0')

            # Calculate percentages
            local supplier_pct=$(calc_pct "$with_supplier" "$total")
            local version_pct=$(calc_pct "$with_version" "$total")
            local purl_pct=$(calc_pct "$with_purl" "$total")

            # Format output with Y/N indicators
            local ts_icon="N"
            [[ -n "$has_timestamp" ]] && ts_icon="Y"
            local author_icon="N"
            [[ -n "$has_author" ]] && author_icon="Y"
            local deps_icon="N"
            [[ $(to_int "$has_deps") -gt 0 ]] && deps_icon="Y"

            echo "${ts_icon}|${author_icon}|${supplier_pct}%|${version_pct}%|${purl_pct}%|${deps_icon}"
          }

          # NTIA Minimum Elements check for SPDX
          ntia_spdx() {
            local path="$1"
            [[ ! -f "$path" ]] && return

            # Get total package count
            local total
            total=$(jq '.packages | length // 0' "$path" 2>/dev/null) || total=0
            total=$(to_int "$total")

            # SBOM-level checks
            local has_timestamp
            has_timestamp=$(jq -r '.creationInfo.created // empty' "$path" 2>/dev/null)
            local has_author
            has_author=$(jq -r '.creationInfo.creators[0] // empty' "$path" 2>/dev/null)

            # Component-level NTIA fields - single jq call for efficiency
            local counts
            counts=$(jq '{
              with_supplier: [.packages[]? | select(.supplier != null and .supplier != "" and .supplier != "NOASSERTION")] | length,
              with_version: [.packages[]? | select(.versionInfo != null and .versionInfo != "" and .versionInfo != "NOASSERTION")] | length,
              with_purl: [.packages[]? | select(.externalRefs[]? | .referenceType == "purl")] | length,
              has_deps: (.relationships | length // 0)
            }' "$path" 2>/dev/null) || counts='{"with_supplier":0,"with_version":0,"with_purl":0,"has_deps":0}'

            local with_supplier=$(echo "$counts" | jq -r '.with_supplier // 0')
            local with_version=$(echo "$counts" | jq -r '.with_version // 0')
            local with_purl=$(echo "$counts" | jq -r '.with_purl // 0')
            local has_deps=$(echo "$counts" | jq -r '.has_deps // 0')

            # Calculate percentages
            local supplier_pct=$(calc_pct "$with_supplier" "$total")
            local version_pct=$(calc_pct "$with_version" "$total")
            local purl_pct=$(calc_pct "$with_purl" "$total")

            # Format output with Y/N indicators
            local ts_icon="N"
            [[ -n "$has_timestamp" ]] && ts_icon="Y"
            local author_icon="N"
            [[ -n "$has_author" ]] && author_icon="Y"
            local deps_icon="N"
            [[ $(to_int "$has_deps") -gt 0 ]] && deps_icon="Y"

            echo "${ts_icon}|${author_icon}|${supplier_pct}%|${version_pct}%|${purl_pct}%|${deps_icon}"
          }

          # Add a row to the package detection table
          add_row() {
            local tool="$1"
            local format="$2"
            local data="$3"
            [[ -z "$data" ]] && return

            local total unique version score
            IFS='|' read -r total unique version score <<< "$data"

            # Validate we got all fields
            [[ -z "$total" ]] && total=0
            [[ -z "$unique" ]] && unique=0
            [[ -z "$version" ]] && version="N/A"
            [[ -z "$score" ]] && score="N/A"

            local dup
            dup=$(calc_dup "$total" "$unique")
            echo "| $tool | $format ($version) | $total | $unique | $dup | $score |" >> "${GITHUB_STEP_SUMMARY}"
          }

          # Add a row to the NTIA table
          add_ntia_row() {
            local tool="$1"
            local format="$2"
            local data="$3"
            [[ -z "$data" ]] && return

            local ts author supplier version purl deps
            IFS='|' read -r ts author supplier version purl deps <<< "$data"

            # Set defaults for empty fields
            [[ -z "$ts" ]] && ts="N"
            [[ -z "$author" ]] && author="N"
            [[ -z "$supplier" ]] && supplier="0%"
            [[ -z "$version" ]] && version="0%"
            [[ -z "$purl" ]] && purl="0%"
            [[ -z "$deps" ]] && deps="N"

            echo "| $tool | $format | $ts | $author | $supplier | $version | $purl | $deps |" >> "${GITHUB_STEP_SUMMARY}"
          }

          # === Generate Report ===

          # Header
          if [[ -n "$BENCHMARK_TITLE" ]]; then
            echo "## $BENCHMARK_TITLE" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
          fi

          # Baseline (if exists)
          BASELINE_FILE="${BENCHMARK_NAME}-baseline/baseline.txt"
          if [[ -f "$BASELINE_FILE" ]]; then
            BASELINE_COUNT=$(wc -l < "$BASELINE_FILE" | tr -d ' ')
            echo "**Baseline:** ${BASELINE_COUNT} packages" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
          fi

          # === Package Detection Table ===
          echo "### Package Detection" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tool | Format | Packages | Unique | Duplication % | Quality Score |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| -- | -- | -- | -- | -- | -- |" >> "${GITHUB_STEP_SUMMARY}"

          # Core tools - CycloneDX
          add_row "Trivy (${TRIVY_VERSION})" "CycloneDX" "$(score_cdx "${BENCHMARK_NAME}-trivy/trivy.cdx.json")"
          add_row "Syft (${SYFT_VERSION})" "CycloneDX" "$(score_cdx "${BENCHMARK_NAME}-syft/syft.cdx.json")"
          add_row "sbomify" "CycloneDX" "$(score_cdx "${BENCHMARK_NAME}-sbomify/sbomify.cdx.json")"

          # Extra tools - CycloneDX
          if [[ "$EXTRA_TOOLS" == *"cyclonedx-python"* ]]; then
            add_row "cyclonedx-python (${CYCLONEDX_PYTHON_VERSION})" "CycloneDX" "$(score_cdx "${BENCHMARK_NAME}-cyclonedx/cyclonedx.cdx.json")"
          fi
          if [[ "$EXTRA_TOOLS" == *"sbom4python"* ]]; then
            add_row "sbom4python (${SBOM4PYTHON_VERSION})" "CycloneDX" "$(score_cdx "${BENCHMARK_NAME}-sbom4python/sbom4python.cdx.json")"
          fi

          # Core tools - SPDX
          add_row "Trivy (${TRIVY_VERSION})" "SPDX" "$(score_spdx "${BENCHMARK_NAME}-trivy/trivy.spdx.json")"
          add_row "Syft (${SYFT_VERSION})" "SPDX" "$(score_spdx "${BENCHMARK_NAME}-syft/syft.spdx.json")"

          # Extra tools - SPDX
          if [[ "$EXTRA_TOOLS" == *"sbom4python"* ]]; then
            add_row "sbom4python (${SBOM4PYTHON_VERSION})" "SPDX" "$(score_spdx "${BENCHMARK_NAME}-sbom4python/sbom4python.spdx.json")"
          fi

          # === NTIA Minimum Elements Table ===
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "### NTIA Minimum Elements" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tool | Format | Timestamp | Author | Supplier % | Version % | PURL % | Dependencies |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| -- | -- | -- | -- | -- | -- | -- | -- |" >> "${GITHUB_STEP_SUMMARY}"

          # Core tools - CycloneDX
          add_ntia_row "Trivy" "CycloneDX" "$(ntia_cdx "${BENCHMARK_NAME}-trivy/trivy.cdx.json")"
          add_ntia_row "Syft" "CycloneDX" "$(ntia_cdx "${BENCHMARK_NAME}-syft/syft.cdx.json")"
          add_ntia_row "sbomify" "CycloneDX" "$(ntia_cdx "${BENCHMARK_NAME}-sbomify/sbomify.cdx.json")"

          # Extra tools - CycloneDX
          if [[ "$EXTRA_TOOLS" == *"cyclonedx-python"* ]]; then
            add_ntia_row "cyclonedx-python" "CycloneDX" "$(ntia_cdx "${BENCHMARK_NAME}-cyclonedx/cyclonedx.cdx.json")"
          fi
          if [[ "$EXTRA_TOOLS" == *"sbom4python"* ]]; then
            add_ntia_row "sbom4python" "CycloneDX" "$(ntia_cdx "${BENCHMARK_NAME}-sbom4python/sbom4python.cdx.json")"
          fi

          # Core tools - SPDX
          add_ntia_row "Trivy" "SPDX" "$(ntia_spdx "${BENCHMARK_NAME}-trivy/trivy.spdx.json")"
          add_ntia_row "Syft" "SPDX" "$(ntia_spdx "${BENCHMARK_NAME}-syft/syft.spdx.json")"

          # Extra tools - SPDX
          if [[ "$EXTRA_TOOLS" == *"sbom4python"* ]]; then
            add_ntia_row "sbom4python" "SPDX" "$(ntia_spdx "${BENCHMARK_NAME}-sbom4python/sbom4python.spdx.json")"
          fi

          # Legend
          {
            echo ""
            echo "<details><summary>NTIA Field Legend</summary>"
            echo ""
            echo "- **Timestamp**: SBOM creation timestamp present (Y/N)"
            echo "- **Author**: SBOM author/creator identified (Y/N)"
            echo "- **Supplier %**: Percentage of components with supplier/publisher info"
            echo "- **Version %**: Percentage of components with version info"
            echo "- **PURL %**: Percentage of components with Package URL identifier"
            echo "- **Dependencies**: Dependency relationships present (Y/N)"
            echo ""
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
