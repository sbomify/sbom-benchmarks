---
name: Java
on:
  push:
    branches:
      - master
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
      - '.github/workflows/_sbom-benchmark.yml'

jobs:
  benchmark:
    uses: ./.github/workflows/_sbom-benchmark.yml
    with:
      name: java
      target_type: filesystem
      target_path: /tmp/keycloak
      setup_commands: |
        git clone --depth 1 --branch 26.4.7 https://github.com/keycloak/keycloak.git /tmp/keycloak
      sbomify_input: /tmp/keycloak/pom.xml
      sbomify_input_type: lock_file
      title: Java (Keycloak 26.4.7) Benchmark
