---
name: JavaScript
on:
  push:
    branches:
      - master
    paths:
      - 'javascript/**'
      - '.github/workflows/javascript.yml'
      - '.github/workflows/_sbom-benchmark.yml'
  pull_request:
    paths:
      - 'javascript/**'
      - '.github/workflows/javascript.yml'
      - '.github/workflows/_sbom-benchmark.yml'

jobs:
  benchmark:
    uses: ./.github/workflows/_sbom-benchmark.yml
    with:
      name: javascript
      target_type: filesystem
      target_path: /tmp/workers-sdk
      setup_commands: |
        git clone --depth 1 --branch wrangler@3.99.0 https://github.com/cloudflare/workers-sdk.git /tmp/workers-sdk
      sbomify_input: /tmp/workers-sdk/pnpm-lock.yaml
      sbomify_input_type: lock_file
      title: JavaScript (Cloudflare workers-sdk) Benchmark
